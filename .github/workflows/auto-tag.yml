name: Auto-tag on tools change

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "whoops.nuspec"

jobs:
  runner-plan:
    uses: HolySpiritStudios/holy-github-actions/.github/workflows/runner-plan.yml@main
    with:
      profile: standard
  tag:
    needs: runner-plan
    runs-on: ${{ fromJSON(needs.runner-plan.outputs.runs-on) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from nuspec
        id: version
        shell: bash
        run: |
          ver=$(grep -oP '(?<=<version>)[^<]+' whoops.nuspec)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Detected version: $ver"

      - name: Check if tag already exists
        id: check
        shell: bash
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
