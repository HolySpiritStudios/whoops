name: Publish to Chocolatey

on:
  push:
    tags:
      - "v*"

jobs:
  runner-plan:
    permissions:
      contents: read
      actions: read
      packages: read
    uses: HolySpiritStudios/holy-github-actions/.github/workflows/runner-plan.yml@main
    with:
      profile: windows

  test:
    needs: runner-plan
    runs-on: ${{ fromJSON(needs.runner-plan.outputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -RequiredVersion 5.5.0

      - name: Run tests
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.5.0
          $result = Invoke-Pester tests\ -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  publish:
    needs: [test, runner-plan]
    runs-on: ${{ fromJSON(needs.runner-plan.outputs.runs-on) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Verify nuspec version matches tag
        shell: powershell
        run: |
          [xml]$nuspec = Get-Content whoops.nuspec
          $nuspecVer = $nuspec.package.metadata.version
          $tagVer = "${{ steps.version.outputs.version }}"
          if ($nuspecVer -ne $tagVer) {
            Write-Error "Version mismatch: nuspec=$nuspecVer tag=$tagVer"
            exit 1
          }
          Write-Host "Version verified: $nuspecVer"

      - name: Pack
        shell: powershell
        run: choco pack whoops.nuspec

      - name: Push to Chocolatey
        shell: powershell
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          choco apikey add --source https://push.chocolatey.org/ --key $env:CHOCO_API_KEY
          choco push whoops.${{ steps.version.outputs.version }}.nupkg --source https://push.chocolatey.org/

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "whoops.${{ steps.version.outputs.version }}.nupkg" `
            --title "Whoops ${{ steps.version.outputs.version }}" `
            --generate-notes
